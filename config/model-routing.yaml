defaults:
  extraction: fast
  normalization: medium
  analysis: high
  synthesis: high
  qa: high
  formatting: fast

routes:
  target_resolution: fast
  source_registry: fast
  filing_field_extraction: medium
  evidence_normalization: medium
  financial_history_normalization: medium
