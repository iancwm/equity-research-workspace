    source_ids: [S-005]
    last_updated: '2026-09-09'
    status: active
  - id: A-003
    name: FY2027 EBIT margin
    base: 32.1
    bear: 30.8
    bull: 33.0
    units: percent
    owner_node: company_overlay
    rationale: Anchored to FY2025 32.0% EBIT margin; base case excludes one-time tariff-refund benefit but retains modest Services-mix and scale benefit. Full forecast mechanics are in data/scenario-forecast.csv.
