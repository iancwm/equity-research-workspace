    last_updated: '2026-09-09'
    status: active
  - id: A-004
    name: FY2027 diluted shares
    base: 14.60
    bear: 14.65
    bull: 14.50
    units: billions
    owner_node: company_overlay
    rationale: Continued net share repurchases, with the pace moderated by a larger equity base and valuation.
    source_ids: [S-001, S-003]
    last_updated: '2026-09-09'
    status: active
  - id: A-005
    name: Equity valuation multiple on FY2027 EPS
    base: 34.3
    bear: 27.5
    bull: 37.0
    units: x
