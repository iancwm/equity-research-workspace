    last_updated: '2026-09-09'
    status: active
bear_case:
  probability: 0.25
  description: Memory cost inflation and slower premium-device demand compress margin; Services growth does not offset hardware weakness.
bull_case:
  probability: 0.25
  description: Premium share gains, a successful product cycle and sustained Services growth lift revenue and operating leverage.
scenario_overrides:
  base_case_probability: 0.50
  valuation_date: '2026-09-09'
  tax_rate: 16.5
  long_term_growth_rate: 3.0
  dcf_wacc: 7.5
  dcf_terminal_year: FY2030E
  dcf_net_cash: 62.173
  scenario_probabilities:
    bear: 0.25
    base: 0.50
    bull: 0.25
  forecast_source: data/scenario-forecast.csv
  forecast_method:
    revenue: Prior-year revenue multiplied by one plus scenario revenue growth.
    ebit: Revenue multiplied by scenario EBIT margin.
    net_income: EBIT multiplied by one minus 16.5% tax rate; other income is conservatively set to zero in forecast years.
    eps: Net income divided by scenario diluted shares.
    cfo: Revenue multiplied by scenario CFO margin.
    capex: CFO minus FCF, with FCF set from the scenario FCF margin.
    fcf: CFO minus capex.
  FQ4_2026_management_outlook:
    revenue_growth_percent: [9.0, 11.0]
    reported_gross_margin_percent: [47.0, 48.0]
    tariff_refund_benefit_percentage_points: 1.0
    adjusted_gross_margin_percent: [46.0, 47.0]
    operating_expense_USD_billions: [19.1, 19.4]
    other_income_expense_USD_millions: 350
    tax_rate_percent: 16.5
    sources: [S-008]
    notes: Management also expects a 2.5-point sequential FX headwind and higher supply-constraint impact across iPhone, Mac and iPad.
