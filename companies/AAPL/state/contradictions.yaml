contradictions:
  - id: C-001
    topic: FY2026 profitability quality
    evidence_for: Q3 gross margin was 50.1% and diluted EPS grew 29% YoY.
    evidence_against: Approximately 200 bp of Q3 gross margin and $0.11 of EPS came from tariff refunds, while the company expects component-cost pressure to intensify.
    source_ids: [S-001, S-002]
    resolution: Treat tariff refunds as non-recurring and do not extrapolate Q3's reported margin into FY2027.
    status: resolved_for_base_case
  - id: C-002
    topic: Premium-market resilience
    evidence_for: IDC says Apple gained share while global smartphone shipments fell in Q2 2026, consistent with scale and premium-mix resilience.
    evidence_against: IDC forecasts a steep annual unit contraction and Apple identifies memory, NAND and DRAM cost pressure as material risks.
    source_ids: [S-001, S-005]
    resolution: Base case permits share gains but assumes growth decelerates materially from FY2026.
    status: unresolved
  - id: C-003
    topic: App Store economics
    evidence_for: Apple's revised EU terms retain commissions, including 26%/15% Apple IAP tiers.
    evidence_against: DMA permits alternative app stores, web distribution and alternative payments, increasing leakage and compliance risk.
    source_ids: [S-006, S-007]
    resolution: No quantified revenue haircut is modeled because Apple does not disclose the affected EU App Store revenue pool; maintain as a monitor and research gap.
    status: unresolved
  - id: C-004
    topic: Valuation-method divergence
    evidence_for: Linked probability-weighted P/E scenarios yield $313.9 per share, approximately the market snapshot price.
    evidence_against: The illustrative DCF yields $237.2 per share using a 7.5% WACC and 3.0% terminal growth.
    source_ids: [S-004]
    resolution: Do not privilege either method or issue a benchmark-relative rating until peer/consensus evidence and a more fully benchmarked DCF are available.
    status: unresolved
