_subdirectory: templates/company
_templates_suffix: .jinja

company_name:
  type: str
  help: Legal/company display name

ticker:
  type: str
  help: Primary listing ticker

exchange:
  type: str
  default: NYSE

benchmark:
  type: str
  default: S&P 500

base_currency:
  type: str
  default: USD

rating_convention:
  type: str
  choices:
    - Overweight/Equal-weight/Underweight
    - Buy/Hold/Sell
  default: Overweight/Equal-weight/Underweight
