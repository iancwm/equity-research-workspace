name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install migration test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build portable skill archive
        run: python tools/package_skill.py --format json
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/package_skill.py --expected-tag "${{ github.ref_name }}" --format json
